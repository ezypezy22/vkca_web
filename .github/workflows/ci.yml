name: CI
on: [push, pull_request]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: mypy strict check
        run: mypy --strict web/server.py contest_log.py plugins/ web/cosb.py web/qrz.py || echo "mypy found issues (non-blocking)"
      - name: ruff lint check
        run: ruff check . || echo "ruff found issues (non-blocking)"
      - name: black formatting check
        run: black --check . || echo "black found formatting issues (non-blocking)"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest --verbose --tb=short
